<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DOPA BLAST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{--font:"Dela Gothic One","Hiragino Sans","Arial Black",sans-serif}
html,body{margin:0;height:100%;background:#07051a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--font);color:#fff}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;text-align:center;padding:16px;box-sizing:border-box}
.dim{background:radial-gradient(circle at 50% 45%,rgba(30,10,60,.55),rgba(3,2,12,.88))}
.hidden{display:none!important}
.logo{font-size:clamp(48px,13vw,110px);line-height:.9;letter-spacing:.02em;background:linear-gradient(90deg,#ff3d8b,#ffd23a,#6dff4f,#2fd9ff,#b06bff,#ff3d8b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bob 1.2s ease-in-out infinite;will-change:transform}
@keyframes hueflow{to{background-position:300% 0}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg) scale(1.03)}}
.sub{font-size:15px;opacity:.85;line-height:1.8;font-family:"Hiragino Sans",sans-serif;font-weight:700}
.btn{font-family:var(--font);font-size:26px;padding:16px 44px;border-radius:999px;border:0;color:#1a0630;background:linear-gradient(180deg,#fff6a8,#ffc531);box-shadow:0 0 30px #ffc531,0 6px 0 #a8650a;cursor:pointer;animation:pulse .9s ease-in-out infinite}
.btn:active{transform:translateY(4px);box-shadow:0 0 30px #ffc531,0 2px 0 #a8650a}
@keyframes pulse{50%{transform:scale(1.07)}}
h2{margin:0;font-size:clamp(28px,7vw,48px);font-weight:400;text-shadow:0 0 20px #ff3d8b,0 4px 0 #000}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;max-width:100%}
.card{--rc:#e8e8ff;position:relative;width:min(29vw,200px);min-height:250px;box-sizing:border-box;padding:16px 10px 14px;border-radius:18px;border:3px solid var(--rc);background:linear-gradient(180deg,rgba(40,20,80,.95),rgba(10,5,30,.97));box-shadow:0 0 28px var(--rc),inset 0 0 30px rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s}
.cards .card{opacity:0;animation:deal .5s cubic-bezier(.2,1.6,.4,1) forwards}
.cards .card:hover{transform:translateY(-10px) scale(1.04)}
@keyframes deal{0%{opacity:0;transform:translateY(120px) rotateY(180deg) scale(.4)}100%{opacity:1;transform:none}}
.card.r1{--rc:#3db8ff}.card.r2{--rc:#c04dff}.card.r3{--rc:#ffc531;background:linear-gradient(180deg,rgba(90,60,0,.95),rgba(30,10,0,.97))}
.card.r3::after{content:"";position:absolute;inset:-3px;border-radius:18px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:250% 100%;animation:shine 1.4s linear infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
.rar{font-size:12px;letter-spacing:.2em;color:var(--rc);text-shadow:0 0 10px var(--rc)}
.ic{font-size:clamp(40px,10vw,64px);filter:drop-shadow(0 0 14px var(--rc))}
.nm{font-size:clamp(16px,4.2vw,22px)}
.ds{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:clamp(11px,2.9vw,13px);line-height:1.5;opacity:.9}
.lv{font-size:12px;opacity:.7}
.syn{margin-top:auto;font-size:11px;padding:4px 8px;border-radius:8px;background:#ffc531;color:#2a1000;animation:pulse .5s ease-in-out infinite;box-shadow:0 0 16px #ffc531}
.card.picked{animation:picked .6s ease-in forwards!important}
.card.gone{animation:gone .35s ease-in forwards!important}
@keyframes picked{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(2.4);opacity:0}}
@keyframes gone{to{transform:translateY(80px) scale(.6);opacity:0}}
#reveal .rays{position:absolute;width:200vmax;height:200vmax;left:50%;top:50%;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 22deg);opacity:.22;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
#reveal{--rc:#fff}
#reveal .gift{font-size:110px;animation:shakeg .08s linear infinite;filter:drop-shadow(0 0 30px var(--rc))}
@keyframes shakeg{0%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.12)}100%{transform:rotate(-12deg) scale(1)}}
#reveal .card{animation:popin .55s cubic-bezier(.2,1.8,.4,1) both;transform-origin:center;width:min(70vw,240px);min-height:280px}
@keyframes popin{0%{transform:scale(0) rotate(-540deg)}100%{transform:scale(1)}}
#reveal .tag{font-size:clamp(30px,9vw,56px);color:var(--rc);text-shadow:0 0 24px var(--rc),0 4px 0 #000;animation:popin .5s .1s cubic-bezier(.2,1.8,.4,1) both}
.hint{font-size:13px;opacity:.6;animation:pulse 1s infinite}
.stats{font-size:20px;line-height:1.7}
.stats b{font-size:34px;color:#ffd23a;text-shadow:0 0 16px #ffc531}
.rank{width:min(92vw,360px);max-height:28vh;overflow-y:auto;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;box-sizing:border-box}
.rank h3{margin:0 0 4px;font-weight:400;font-size:13px;letter-spacing:.25em;color:#ffd23a}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:2em minmax(0,1fr) auto 4.6em;gap:8px;align-items:center;font-size:13px;padding:3px 4px;border-radius:8px;font-variant-numeric:tabular-nums}
.rank li.me{background:rgba(255,210,58,.28);box-shadow:0 0 12px rgba(255,197,49,.6)}
.rank .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-family:"Hiragino Sans",sans-serif;font-weight:700}
.rank .st{font-size:11px;opacity:.75;text-align:right}
.rank .st.cl{color:#ffd23a;opacity:1}
.rank .empty{font-size:12px;opacity:.6;font-family:"Hiragino Sans",sans-serif;font-weight:700;padding:6px 0}
.last{font-size:15px;line-height:1.5}.last b{color:#ffd23a;font-size:22px}
.btn.sm{font-size:18px;padding:12px 30px;animation:none;background:linear-gradient(180deg,#e8e8ff,#9fa3c8);box-shadow:0 5px 0 #4b4d70}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;background:rgba(255,255,255,.1);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="サウンド切替">🔊</button>

<div id="title" class="overlay dim">
  <div class="logo">DOPA<br>BLAST</div>
  <div class="sub">全10ステージ。ブロックをタップして爆破。<br>同じ色に<span style="color:#ffd23a">連鎖</span>していく。<br><span style="color:#7ff">♪ 拍に合わせてタップ</span>で JUST! ボム消費なし<br>💥 ⭐ 🌈 特殊ブロックを巻き込め。<br>宝箱でパワーを集めて、盤面をふっ飛ばせ。</div>
  <div class="last hidden" id="lastRun"></div>
  <button class="btn" id="startBtn">START</button>
  <div class="rank"><h3>RANKING</h3><ol id="rankList"></ol></div>
</div>

<div id="reveal" class="overlay dim hidden">
  <div class="rays"></div>
  <div class="gift">🎁</div>
  <div class="tag hidden"></div>
  <div class="slot"></div>
  <div class="hint hidden">TAP</div>
</div>

<div id="choice" class="overlay dim hidden">
  <h2>パワーを選べ</h2>
  <div class="cards"></div>
</div>

<div id="over" class="overlay dim hidden">
  <h2 style="text-shadow:0 0 20px #2fd9ff,0 4px 0 #000">GAME OVER</h2>
  <div class="stats"></div>
  <div class="row"><button class="btn" id="retryBtn">RETRY</button><button class="btn sm" id="titleBtn">TITLE</button></div>
</div>

<script>
'use strict';
// ================= CONFIG =================
const COLS = 7, ROWS = 9;
const FONT = '"Dela Gothic One","Hiragino Sans","Arial Black",sans-serif';
const TAU = Math.PI * 2;
const PAL = [
  { c:'#ff3d8b', d:'#a8104a', l:'#ffb3d0' },
  { c:'#2fd9ff', d:'#0a6f9a', l:'#c4f6ff' },
  { c:'#ffd23a', d:'#b07a00', l:'#fff3b8' },
  { c:'#6dff4f', d:'#1f8f10', l:'#d6ffc9' },
  { c:'#b06bff', d:'#5a18b0', l:'#e6d0ff' },
];
const GOLD = '#ffc531';
const RAR = [
  { n:'COMMON', c:'#e8e8ff' }, { n:'RARE', c:'#3db8ff' },
  { n:'EPIC', c:'#c04dff' }, { n:'LEGENDARY', c:GOLD },
];
const ITEMS = {
  powder:  { name:'火薬',       icon:'🔥', rar:0, max:3, desc:'爆発範囲 +1' },
  fuse:    { name:'予備の導火線', icon:'🧨', rar:0, max:4, desc:'ボム上限 +1、回復が速くなる' },
  map:     { name:'宝の地図',    icon:'🗺️', rar:0, max:3, desc:'宝箱の出る数 +1' },
  gear:    { name:'金の歯車',    icon:'⚙️', rar:1, max:9, desc:'スコア ×1.5' },
  spark:   { name:'雷管',       icon:'⚡', rar:1, max:1, desc:'爆発が斜めにも届く' },
  fork:    { name:'音叉',       icon:'🎵', rar:1, max:3, desc:'10連鎖ごとに衝撃波。ランダムに5個点火' },
  cluster: { name:'子爆弾',     icon:'💣', rar:2, max:3, desc:'巻き込んだブロックが30%で子爆弾になる' },
  prism:   { name:'プリズム',    icon:'🌈', rar:2, max:3, desc:'25%で違う色にも引火' },
  thunder: { name:'雷雲',       icon:'🌩️', rar:3, max:2, desc:'15連鎖ごとに落雷。横一列まるごと点火' },
  echo:    { name:'残響',       icon:'🔔', rar:3, max:3, desc:'爆発のたび15%で、同じ色のどこかへ飛び火' },
  metro:   { name:'メトロノーム', icon:'🎼', rar:0, max:2, desc:'JUSTの判定がゆるくなる' },
  magnet:  { name:'磁石',       icon:'🧲', rar:0, max:2, desc:'同じ色が固まって降ってくる' },
  toolbox: { name:'工具箱',     icon:'🧰', rar:1, max:2, desc:'特殊ブロックが出やすく、同時に多く出る' },
  drum:    { name:'ドラム',     icon:'🥁', rar:1, max:2, desc:'JUSTタップの引火が十字に1マス伸びる' },
  turbo:   { name:'ターボ',     icon:'🚀', rar:1, max:2, desc:'OVERFLOWに必要な爆破数 -5' },
  mirror:  { name:'鏡',         icon:'🪞', rar:2, max:3, desc:'爆発のたび10%で、左右対称の位置にも点火' },
  blackhole:{ name:'ブラックホール', icon:'🕳️', rar:2, max:1, desc:'25連鎖ごとに、盤面で一番多い色をまとめて点火' },
  phoenix: { name:'不死鳥の羽',  icon:'🪶', rar:3, max:2, desc:'10連鎖以上が途切れる瞬間、3か所に再点火（連鎖ごとに1回）' },
  supernova:{ name:'超新星',     icon:'🌟', rar:3, max:1, desc:'OVERFLOWの瞬間、一番多い色が全部点火' },
};
const SYN = [
  { id:'bigbang', name:'BIG BANG',     need:['powder','spark'],  desc:'爆発が正方形になる' },
  { id:'storm',   name:'STORM',        need:['cluster','thunder'], desc:'落雷が子爆弾をばらまく' },
  { id:'rainbow', name:'RAINBOW ECHO', need:['prism','echo'],    desc:'残響がどの色にも飛ぶ' },
  { id:'symph',   name:'SYMPHONY',     need:['fork','echo'],     desc:'衝撃波の点火数が2倍' },
  { id:'groove',  name:'GROOVE',       need:['metro','drum'],    desc:'JUST 3連続ごとに落雷' },
  { id:'infinity',name:'INFINITY',     need:['phoenix','turbo'], desc:'OVERFLOWのたび不死鳥の羽が復活' },
  { id:'mirrorw', name:'MIRROR WORLD', need:['mirror','prism'],  desc:'鏡が上下にも映る' },
  { id:'horizon', name:'EVENT HORIZON',need:['blackhole','magnet'], desc:'ブラックホールが12連鎖ごとに' },
];
const SPECIALS = {
  rainbow: { icon:'🌈', w:28, col:'#ffffff' }, // どの色とも連鎖
  tnt:     { icon:'💥', w:27, col:'#ff6a3d' }, // 半径2を全色点火
  star:    { icon:'⭐', w:15, col:'#fff6a8' }, // 盤面の同色すべて点火
};
const MILES = [[10,'NICE!'],[20,'FEVER!!'],[30,'AMAZING!!'],[45,'INSANE!!!'],[60,'GODLIKE'],[80,'UNREAL'],[100,'∞ BEYOND ∞'],[150,'DOPAMINE OVERDOSE'],[200,'脳が溶ける']];

// ================= UTIL =================
const rand = (a=1,b) => b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const fmt = n => Math.round(n).toLocaleString('en-US');
const lv = id => inv[id]||0;
const has = id => lv(id)>0;
const syn = id => synergies.has(id);
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ================= CANVAS =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, cell, bx, by;
let SPR = [], SPR_CHEST, SPR_RAINBOW;
const GLOWS = {};
function glow(col){
  if (GLOWS[col]) return GLOWS[col];
  const s=64, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'), gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.18,col); if(/^#[0-9a-f]{6}$/i.test(col)) gr.addColorStop(0.45,col+'55'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
  return GLOWS[col]=c;
}
function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(W*H>450000?1:1.5, window.devicePixelRatio||1);
  for(const k in EMO) delete EMO[k];
  if(typeof TXC!=='undefined') TXC.clear();
  cv.width = W*DPR; cv.height = H*DPR;
  const top = 128, bottom = 112;
  cell = Math.floor(Math.min((W-28)/COLS, (H-top-bottom)/ROWS));
  bx = Math.round((W-cell*COLS)/2);
  by = Math.round(top + ((H-top-bottom) - cell*ROWS)/2);
  buildSprites();
}
function starPath(g,x,y,R,r,n=5){g.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n, rad=i%2?r:R;g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}g.closePath();}
function glyph(g,i,x,y,s){
  g.beginPath();
  if(i===0){g.arc(x,y,s*0.5,0,TAU);}
  else if(i===1){g.moveTo(x,y-s*0.6);g.lineTo(x+s*0.5,y);g.lineTo(x,y+s*0.6);g.lineTo(x-s*0.5,y);g.closePath();}
  else if(i===2){g.moveTo(x,y-s*0.55);g.lineTo(x+s*0.55,y+s*0.42);g.lineTo(x-s*0.55,y+s*0.42);g.closePath();}
  else if(i===3){rr(g,x-s*0.42,y-s*0.42,s*0.84,s*0.84,s*0.15);}
  else starPath(g,x,y,s*0.6,s*0.26);
}
function mkBlock(S,p,i){
  const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const m=S*0.05, s=S-m*2, r=s*0.24;
  rr(g,m,m,s,s,r);
  const gr=g.createLinearGradient(0,m,0,m+s); gr.addColorStop(0,p.l); gr.addColorStop(0.4,p.c); gr.addColorStop(1,p.d);
  g.fillStyle=gr; g.fill();
  g.lineWidth=S*0.035; g.strokeStyle='rgba(255,255,255,.6)'; g.stroke();
  rr(g,m+s*0.1,m+s*0.07,s*0.8,s*0.36,r*0.7); g.fillStyle='rgba(255,255,255,.3)'; g.fill();
  g.fillStyle='rgba(255,255,255,.9)'; g.strokeStyle=p.d; g.lineWidth=S*0.04;
  glyph(g,i,S/2,S/2+s*0.04,s*0.32); g.stroke(); g.fill();
  return c;
}
function mkChest(S){
  const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const m=S*0.05, s=S-m*2, r=s*0.2;
  rr(g,m,m,s,s,r);
  const gr=g.createLinearGradient(0,m,0,m+s); gr.addColorStop(0,'#fff6b0'); gr.addColorStop(0.45,GOLD); gr.addColorStop(1,'#a86200');
  g.fillStyle=gr; g.fill(); g.lineWidth=S*0.045; g.strokeStyle='#fff'; g.stroke();
  g.fillStyle='rgba(120,50,0,.55)'; g.fillRect(m,m+s*0.42,s,s*0.14);
  starPath(g,S/2,S/2,s*0.3,s*0.13); g.fillStyle='#fff'; g.fill(); g.strokeStyle='#a86200'; g.lineWidth=S*0.03; g.stroke();
  return c;
}
function mkRainbow(S){
  const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  const m=S*0.05, s=S-m*2, r=s*0.24;
  rr(g,m,m,s,s,r);
  const gr=g.createLinearGradient(m,m,m+s,m+s); PAL.forEach((p,i)=>gr.addColorStop(i/(PAL.length-1),p.c));
  g.fillStyle=gr; g.fill(); g.lineWidth=S*0.045; g.strokeStyle='#fff'; g.stroke();
  rr(g,m+s*0.1,m+s*0.07,s*0.8,s*0.36,r*0.7); g.fillStyle='rgba(255,255,255,.35)'; g.fill();
  starPath(g,S/2,S/2+s*0.04,s*0.3,s*0.13,4); g.fillStyle='#fff'; g.fill();
  return c;
}
function buildSprites(){
  const S=Math.max(8,Math.ceil(cell*DPR));
  SPR = PAL.map((p,i)=>mkBlock(S,p,i));
  SPR_CHEST = mkChest(S);
  SPR_RAINBOW = mkRainbow(S);
}

// ================= AUDIO (soft analog) =================
let AC=null, master, fxIn, bgmBus, bgmFilter, wowG, noiseBuf, muted=false;
let nextBeatT=0, beatIdx=0, bgmStart=0, bgmOn=false;
let voiceWin=0, voiceCount=0;
function initAudio(){
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value=-16; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.25;
  master = AC.createGain(); master.gain.value = 0.75;
  master.connect(comp); comp.connect(AC.destination);
  const warm = AC.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=6500; warm.Q.value=0.3; warm.connect(master);
  const rev = AC.createConvolver(); rev.buffer = impulse(2.2, 2.4);
  const wet = AC.createGain(); wet.gain.value=0.38; rev.connect(wet); wet.connect(warm);
  fxIn = AC.createGain(); fxIn.connect(warm); fxIn.connect(rev);
  bgmFilter = AC.createBiquadFilter(); bgmFilter.type='lowpass'; bgmFilter.frequency.value=1300; bgmFilter.Q.value=0.5;
  bgmBus = AC.createGain(); bgmBus.gain.value=0.55; bgmBus.connect(bgmFilter); bgmFilter.connect(warm); bgmFilter.connect(rev);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // tape wow & flutter
  const wow = AC.createOscillator(); wow.frequency.value=0.55; wowG = AC.createGain(); wowG.gain.value=7;
  const flt = AC.createOscillator(); flt.frequency.value=6.3; const fltG = AC.createGain(); fltG.gain.value=2.5;
  wow.connect(wowG); flt.connect(fltG); fltG.connect(wowG); wow.start(); flt.start();
}
function impulse(sec,decay){
  const len=AC.sampleRate*sec, b=AC.createBuffer(2,len,AC.sampleRate);

}

const BPM=92, SPB=60/BPM;
const PROG=[[53,57,60,64],[52,55,59,62],[57,60,64,67],[55,59,62,64]];
function bgmLayers(){
  const n=Object.values(inv).reduce((a,b)=>a+b,0);
  let L = n===0?0 : n<=1?1 : n<=3?2 : n<=5?3 : 4;
  if(fever) L=Math.max(L,3);

}
function startBgm(){ if(!AC||bgmOn) return; bgmOn=true; nextBeatT=AC.currentTime+0.1; bgmStart=nextBeatT; beatIdx=0; }
function bgmTick(){
  if(!AC||!bgmOn) return;
  bgmFilter.frequency.setTargetAtTime(fever?5200:1300+bgmLayers()*350, AC.currentTime, 0.3);
  while(nextBeatT < AC.currentTime+0.15){ scheduleBeat(beatIdx,nextBeatT); nextBeatT+=SPB/2; beatIdx++; }
}
function scheduleBeat(i,t){
  const e=i%8, bar=Math.floor(i/8), ch=PROG[bar%4], L=bgmLayers(), B=bgmBus;
  if(e===0) ch.forEach(n=>{ tone({f:mtof(n),type:'sawtooth',t,a:0.9,d:SPB*4+0.4,g:0.022,cut:1100,dest:B,det:rand(-9,9)}); tone({f:mtof(n),type:'triangle',t,a:0.7,d:SPB*4+0.4,g:0.03,dest:B,det:rand(-5,5)}); });
  if(L>=1 && (e===0||e===3||e===6)) { tone({f:mtof(ch[0]-24),type:'triangle',t,a:0.02,d:0.55,g:0.2,dest:B}); tone({f:mtof(ch[0]-12),type:'sine',t,a:0.02,d:0.4,g:0.06,dest:B}); }
  if(L>=2 && Math.random()>0.18) { const sw=e%2?SPB*0.09:0; tone({f:mtof(ch[(i*3+(bar&1))%4]+12+(e>5?12:0)),type:'triangle',t:t+sw,a:0.006,d:0.38,g:rand(0.025,0.055),cut:3200,dest:B}); }
  if(L>=3) { if(e===0||e===4) tone({f:110,glide:38,type:'sine',t,a:0.003,d:0.3,g:0.32,dest:B}); if(e%2) noise({t:t+SPB*0.06,d:0.05,g:rand(0.01,0.022),f:7500,type:'highpass',dest:B}); if(e===4) noise({t,d:0.18,g:0.05,f:1800,q:0.8,dest:B}); }

}
// beat position in quarter notes, compensated for output latency (what the player actually hears)
function beatPhase(){ if(!AC||!bgmOn) return -1; return (AC.currentTime-(AC.outputLatency||AC.baseLatency||0)-bgmStart)/SPB; }

  if(c>0&&grid[r][c-1]) nb.push(grid[r][c-1].color);

// claude.ai viewer: shared ranking in the artifact db (scores/<viewer id> = {runs:[top 10]})
// anywhere else: this browser only (localStorage)
const RANK_KEY='dopa-blast-rank-v1';
let rankDb=null, rankUser=null, rankUid=null, rankAll=[], lastRun=null;
const byScore=(a,b)=>b.score-a.score;
function localRuns(){ try{ return JSON.parse(localStorage.getItem(RANK_KEY))||[]; }catch(e){ return []; } }
function saveLocal(runs){ try{ localStorage.setItem(RANK_KEY,JSON.stringify(runs.sort(byScore).slice(0,20))); }catch(e){} }
function rankRows(){ return (rankDb ? rankAll : localRuns().map(r=>({...r,uid:null}))).slice().sort(byScore); }
async function initRanking(){
  renderRanking();
  try{
    if(!window.claude?.use) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    rankDb=db; rankUser=user; rankUid=uid;
    db.collection('scores').onSnapshot(snap=>{
      rankAll=[]; for(const d of snap.docs){ for(const r of (d.data()?.runs||[])) rankAll.push({score:r.score,stage:r.stage,clear:r.clear,at:r.at,uid:d.id}); }
      renderRanking();
    },()=>{ rankDb=null; renderRanking(); });
  }catch(e){}
}
let saving=Promise.resolve();
function recordRun(run){
  lastRun=run;
  const runs=localRuns(); runs.push(run); saveLocal(runs);
  if(rankDb){
    const mine=rankAll.filter(r=>r.uid===rankUid).map(({uid,...r})=>r); mine.push(run); mine.sort(byScore);
    rankAll.push({...run,uid:rankUid});
    saving=saving.then(()=>rankDb.doc('scores/'+rankUid).set({runs:mine.slice(0,10)})).catch(()=>{});
  }
  renderRanking();
  return rankRows().findIndex(r=>r.at===run.at&&(!rankDb||r.uid===rankUid))+1;
}
async function renderRanking(){
  const rows=rankRows().slice(0,10), ol=document.getElementById('rankList');
  let names={};
  if(rankUser&&rows.length) try{ names=await rankUser.profiles([...new Set(rows.map(r=>r.uid))]); }catch(e){}
  ol.replaceChildren();
  if(!rows.length){ const li=document.createElement('li'); li.className='empty'; li.textContent='まだ記録なし。10面クリアを目指せ'; ol.append(li); }
  rows.forEach((r,i)=>{
    const li=document.createElement('li'); if(lastRun&&r.at===lastRun.at&&(!rankDb||r.uid===rankUid)) li.className='me';
    const n=document.createElement('span'); n.textContent=(i+1)+'.';
    const w=document.createElement('span'); w.className='who'; w.textContent=r.uid?(names[r.uid]?.isMe?'あなた':(names[r.uid]?.name||'だれか')):'あなた';
    const sc=document.createElement('span'); sc.textContent=fmt(r.score);
    const st=document.createElement('span'); st.className='st'+(r.clear?' cl':''); st.textContent=r.clear?'★CLEAR':'S'+r.stage;
    li.append(n,w,sc,st); ol.append(li);
  });
  const lr=document.getElementById('lastRun');
  if(lastRun){ const rank=rankRows().findIndex(r=>r.at===lastRun.at&&(!rankDb||r.uid===rankUid))+1;
    lr.innerHTML=`${lastRun.clear?'ALL CLEAR!':'STAGE '+lastRun.stage}　今回 <b>${fmt(lastRun.score)}</b>${rank?`　<b>${rank}</b>位`:''}`; lr.classList.remove('hidden'); }
}

function rollRarity(boost=0){
  const w=[Math.max(20,55-boost*2),28,13+boost,4+boost*0.6], tot=w.reduce((a,b)=>a+b); let x=rand(tot);
  for(let i=0;i<4;i++){ if((x-=w[i])<0) return i; } return 0;
}
function rollItem(rar,ex=[]){
  const ok=id=>lv(id)<ITEMS[id].max && !ex.includes(id);
  for(let k=rar;k>=0;k--){ const p=Object.keys(ITEMS).filter(id=>ITEMS[id].rar===k&&ok(id)); if(p.length) return p[(Math.random()*p.length)|0]; }
  for(let k=rar+1;k<4;k++){ const p=Object.keys(ITEMS).filter(id=>ITEMS[id].rar===k&&ok(id)); if(p.length) return p[(Math.random()*p.length)|0]; }
  return null;
}
function synergyIf(id){ return SYN.find(s=>!synergies.has(s.id)&&s.need.includes(id)&&s.need.every(n=>n===id||has(n))); }
function cardHTML(id,extra=''){

}

function updateSim(dt){
  gt+=dt;
  const blow=[];
  for(const row of grid) for(const b of row){ if(!b) continue;
    if(b.fy<b.r){ b.vy+=55*dt; b.fy+=b.vy*dt; if(b.fy>=b.r){ b.fy=b.r; if(b.vy>3){b.sy=0.7;b.sx=1.25;} b.vy=0; } }
    b.sx+=(1-b.sx)*Math.min(1,dt*12); b.sy+=(1-b.sy)*Math.min(1,dt*12); b.flash=Math.max(0,b.flash-dt*4);
    if(state==='play' && b.burning && b.burnAt<=gt) blow.push(b);
  }
  if(state!=='play') return;
  blow.sort((a,b)=>a.burnAt-b.burnAt).forEach(b=>{ if(live(b)) explode(b); });
  for(let i=minis.length-1;i>=0;i--) if(gt>=minis[i].at){ const m=minis.splice(i,1)[0]; detonateMini(m); }
  for(let i=events.length-1;i>=0;i--) if(gt>=events[i].at){ const e=events.splice(i,1)[0]; e.fn(); }
  if(dirty){ applyGravity(); dirty=false; }

  const sec=Math.ceil(stageTime); if(sec!==lastSec){ lastSec=sec; if(sec<=3&&sec>0&&AC) tone({f:sec===1?1320:880,type:'sine',a:0.003,d:0.12,g:0.08}); }
  if(stageTime>0 && bombs<maxBombs()){ charge+=dt/rechargeTime(); if(charge>=1){ charge=0; bombs++; } } else charge=0;
  if(cascadeActive && !minis.length && !events.some(e=>e.cascade) && gt-lastBoom>0.3 && !grid.some(row=>row.some(b=>b&&b.burning))){ if(phoenixLeft>0 && chain>=10) phoenix(); else endCascade(); }
  if(stageTime<=0 && !cascadeActive && !stageEnding){ stageEnding=true; bigText('TIME UP',W/2,H/2,Math.min(64,W/7),'#fff',true); later(0.9,endStage,false); }
}
function updateFx(dt,rdt){

let last=performance.now();
function frame(now){
  const rdt=Math.min(0.05,(now-last)/1000); last=now; T+=rdt;
  timeScale+=(1-timeScale)*Math.min(1,rdt*2.2);
  let dt=rdt*timeScale; if(freeze>0){ freeze-=rdt; dt=0; }
  if(state==='play'||state==='clear'||state==='over'||state==='title') updateSim(dt);
  updateFx(dt,rdt);
  dispScore += (score-dispScore)*Math.min(1,rdt*7); if(Math.abs(score-dispScore)<1) dispScore=score;
  render(rdt);
  bgmTick();
  requestAnimationFrame(frame);
}
resize();
fillBoard();
initRanking();
requestAnimationFrame(frame);
</script>
</body>
